name: Migrer Immobenservices depuis Wix et publier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrer-wix.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: immobenservices-github-pages
  cancel-in-progress: true

jobs:
  migration-et-publication:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt GitHub
        uses: actions/checkout@v6

      - name: Copier intégralement les fichiers publics de Wix
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import mimetypes
          import re
          import shutil
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          SOURCE = 'https://headless-ofurungbkfq-immobenservicesexp-1412.wix-site-host.com'
          OUTPUT = Path('site')
          FILES = [
              'index.html',
              'services.html',
              'biens.html',
              'contact.html',
              'contact.js',
              'photos.css',
              'photos.js',
              'style.css',
              'biens-photos.json',
              'bien-57117867.html',
              'bien-58032723.html',
              'bien-58036142.html',
              'bien-58080969.html',
              'bien-58338943.html',
              'bien-58376411.html',
              'bien-58392384.html',
              'bien-58454678.html',
              'bien-58495212.html',
              'bien-58500955.html',
              'bien-58809573.html',
              'bien-58810246.html',
              'bien-58810379.html',
              'bien-58810565.html',
              'js/wix/address-templates.generated.js',
              'js/wix/client.js',
              'js/wix/config.js',
              'js/wix/form-store.js',
              'js/wix/forms-address-core.js',
              'js/wix/forms-core.js',
              'js/wix/forms-types.js',
              'js/wix/forms.js',
              'js/wix/media.js',
              'js/wix/rich-content.js',
              'js/wix/submissions-core.js',
              'js/wix/submissions.js',
          ]
          assert len(FILES) == 35 and len(set(FILES)) == 35

          def fetch(url, attempts=3):
              for n in range(attempts):
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 Immobenservices-Migration/1.0',
                      'Accept': '*/*',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=35) as response:
                          return response.read(), response.headers.get('Content-Type', '')
                  except Exception:
                      if n == attempts - 1:
                          raise
                      time.sleep(2 * (n + 1))

          if OUTPUT.exists():
              shutil.rmtree(OUTPUT)
          OUTPUT.mkdir(parents=True)

          # 35 fichiers publics publiés sur Wix, y compris les 14 fiches de biens.
          for i, name in enumerate(FILES, 1):
              url = SOURCE + '/' + urllib.parse.quote(name, safe='/')
              data, content_type = fetch(url)
              if not data:
                  raise RuntimeError('Fichier vide : ' + name)
              if name.endswith('.html') and b'<html' not in data[:2048].lower():
                  raise RuntimeError('Réponse inattendue pour ' + name)
              if name.endswith(('.js', '.css', '.json')) and 'text/html' in content_type.lower():
                  raise RuntimeError('Le serveur a renvoyé une page HTML pour ' + name)
              target = OUTPUT / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f'[{i:02d}/{len(FILES)}] {name} ({len(data)} octets)')

          # Rapatrier les photos externes référencées par les HTML/CSS/JSON.
          image_pattern = re.compile(
              r'https://(?:static\.wixstatic\.com|images\.unsplash\.com)/[^\s"\x27<>)]+'
          )
          text_files = [OUTPUT / name for name in FILES if name.endswith(('.html', '.css', '.js', '.json'))]
          urls = set()
          for path in text_files:
              urls.update(image_pattern.findall(path.read_text(encoding='utf-8')))

          mime_extensions = {
              'image/jpeg': '.jpg',
              'image/png': '.png',
              'image/webp': '.webp',
              'image/gif': '.gif',
              'image/avif': '.avif',
              'image/svg+xml': '.svg',
          }
          replacements = {}
          failed_images = []
          for url in sorted(urls):
              try:
                  payload, content_type = fetch(url)
                  mime = content_type.split(';', 1)[0].lower().strip()
                  if not mime.startswith('image/'):
                      raise ValueError('Type MIME inattendu : ' + content_type)
                  ext = mime_extensions.get(mime)
                  if not ext:
                      ext = mimetypes.guess_extension(mime) or '.img'
                  name = hashlib.sha256(url.encode('utf-8')).hexdigest()[:18] + ext
                  dest = OUTPUT / 'assets' / 'media' / name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(payload)
                  replacements[url] = '/assets/media/' + name
              except Exception as error:
                  # Conserver le lien public existant si la copie échoue.
                  failed_images.append((url, str(error)))

          for path in text_files:
              text = path.read_text(encoding='utf-8')
              for old_url, local_url in replacements.items():
                  text = text.replace(old_url, local_url)
              path.write_text(text, encoding='utf-8')

          (OUTPUT / '.nojekyll').write_text('', encoding='utf-8')
          report = [
              '# Rapport de migration — Immobenservices',
              '',
              f'Fichiers Wix copiés : {len(FILES)}',
              f'Images copiées dans GitHub : {len(replacements)}',
              f'Images non copiées (liens externes conservés) : {len(failed_images)}',
              '',
              'Le formulaire Wix Forms doit être testé sur le domaine GitHub Pages.',
              'Les contacts, soumissions, factures et paiements Wix restent dans Wix.',
          ]
          for url, reason in failed_images:
              report.append('- ' + url + ' — ' + reason[:180])
          Path('RAPPORT_MIGRATION.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report[:7]))
          PY

      - name: Enregistrer les fichiers dans le dépôt GitHub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site RAPPORT_MIGRATION.md
          if git diff --cached --quiet; then
            echo 'Le site est déjà à jour.'
          else
            git commit -m 'Migrer le site Immobenservices depuis Wix'
            git push origin HEAD:main
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les pages du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4